#phases
# High-intensity zipf/stream mix; total runtime ~100s
# Access pattern fields: name, randomness (1=random, 0=sequential), stride (bytes), probability weight, rw mode
#   - stride 64 keeps the sequential scanner cache-line aligned; the random patterns ignore stride and sample uniformly
#   - probability weights are relative shares; higher weights get chosen more frequently within the phase loop
# zipf_* regions collectively form an 8 GiB skewed footprint; higher weights on smaller regions approximate a Zipf skew
# stream_region is an 8 GiB sequential scan weighted heavier (60) to drive bandwidth on a single large window
zipf_and_stream_intense
200000
